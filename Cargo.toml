[package]
name = "omega"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "87c535650a3a33b166139b02cdd7327d412d3bca", features = [
    "crypto",
    "files",
    "raw",
    "web-server",
] }

ansi_term = "0.12.1"
argon2 = "0.5.3"
base64 = "0.23.1"
bytes = "1"
dashmap = "6.2.1"
dotenv = "0.15.0"
http = "1"
iota-identity = { git = "https://github.com/TensaminDev/Iota.git", rev = "fe645d74a6356d21cf4705d3c8a8d4ee82bbb8aa" }
once_cell = "1.21.4"
parking_lot = "0.12.5"
rand = "0.10.2"
rustls = { version = "0.23.43", default-features = false, features = [
    "std",
    "tls12",
    "aws-lc-rs",
    "prefer-post-quantum",
] }
sqlx = { version = "0.9.0", features = ["mysql", "runtime-tokio", "migrate"] }
tokio = { version = "*", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.26.0", features = ["v4", "v7"] }
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
